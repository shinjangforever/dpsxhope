name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-api/package-lock.json

      # ติดตั้งเฉพาะที่ชุดทดสอบใช้ ไม่โหลด sentence-transformers/faiss (หนักและไม่จำเป็นต่อด่านนี้)
      - name: Install Python dependencies
        run: python -m pip install -r agent-kit/requirements.txt -r llm-eval/requirements.txt rank-bm25 pypdf

      - name: Install ai-api dependencies
        run: npm ci --prefix ai-api

      # catalog + ลิงก์ในเอกสาร + unit test (รวมการค้นหาภาษาไทยด้วย BM25)
      - name: Check
        run: python hope.py check

      # ทดสอบ agent, workflow, llm-eval และ ai-api กับเซิร์ฟเวอร์จำลอง ไม่ใช้ API key
      - name: End-to-end tests with mock Anthropic server
        run: python hope.py test mock
