<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>dpsxhope banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=JetBrains+Mono:wght@500&display=block">
<style>
  :root { --bg:#0a0a0b; --panel:#17130a; --line:#6e5a26; --node:#d4af37; --core:#f5d76e; --title:#f5d76e; --text:#efe3c2; --en:#ffffff; --muted:#b39a55; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:relative; overflow:hidden; background:var(--bg); font-family:Anuphan, "Noto Sans Thai", sans-serif; }
  #copy { position:absolute; left:64px; }
  h1 { margin:0; color:var(--title); font-weight:700; letter-spacing:-.02em; line-height:1; }
  p { margin:0; }
  .tag { color:var(--text); font-weight:600; }
  .en { color:var(--en); font-weight:600; }
  .sub { color:var(--muted); font-family:"JetBrains Mono", monospace; font-weight:500; }
  svg { position:absolute; inset:0; }
  svg text { font-family:Anuphan, sans-serif; font-weight:600; fill:var(--text); }
</style>
</head>
<body>
<div id="stage">
  <svg id="map" aria-hidden="true"></svg>
  <div id="copy">
    <h1>dpsxhope</h1>
    <p class="tag">แผนที่ความรู้และต้นแบบ AI ที่ใช้งานได้จริง</p>
    <p class="en">AI Knowledge Map &amp; Real-World Blueprints</p>
    <p class="sub">learn · adapt · build · share</p>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const social = q.get('size') === 'social';
  const W = 1280, H = social ? 640 : 320;
  const stage = document.getElementById('stage');
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';

  const copy = document.getElementById('copy');
  copy.style.top = (social ? 186 : 58) + 'px';
  copy.querySelector('h1').style.fontSize = (social ? 104 : 80) + 'px';
  const tag = copy.querySelector('.tag');
  tag.style.fontSize = (social ? 38 : 30) + 'px';
  tag.style.marginTop = (social ? 24 : 16) + 'px';
  const en = copy.querySelector('.en');
  en.style.fontSize = (social ? 30 : 24) + 'px';
  en.style.marginTop = (social ? 10 : 6) + 'px';
  const sub = copy.querySelector('.sub');
  sub.style.fontSize = (social ? 22 : 18) + 'px';
  sub.style.marginTop = (social ? 18 : 12) + 'px';

  const labels = ['Robotics', 'Anatomy', 'Biology', 'Quantum', 'Business', 'Games', 'Sports', '3D'];
  const cx = social ? 945 : 960, cy = H / 2, rx = social ? 215 : 225, ry = social ? 215 : 112;
  const pts = labels.map((name, i) => {
    const a = -Math.PI / 2 + i * Math.PI * 2 / labels.length;
    return { name, x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a), c: Math.cos(a), s: Math.sin(a) };
  });
  const NS = 'http://www.w3.org/2000/svg';
  const map = document.getElementById('map');
  map.setAttribute('viewBox', `0 0 ${W} ${H}`);
  map.setAttribute('width', W);
  map.setAttribute('height', H);
  const css = (name) => getComputedStyle(document.body).getPropertyValue(name);
  const add = (tag, attrs, text) => {
    const el = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    if (text) el.textContent = text;
    map.appendChild(el);
    return el;
  };
  const line = (a, b, w) => add('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: css('--line'), 'stroke-width': w });
  const core = { x: cx, y: cy };
  pts.forEach((p, i) => {
    line(core, p, 2);
    line(p, pts[(i + 1) % pts.length], 1.5);
    line(p, pts[(i + 3) % pts.length], 1);
  });
  add('circle', { cx, cy, r: social ? 54 : 40, fill: css('--panel'), stroke: css('--core'), 'stroke-width': 3 });
  add('text', { x: cx, y: cy + (social ? 13 : 10), 'text-anchor': 'middle', 'font-size': social ? 38 : 28, style: `fill:${css('--core')}` }, 'AI');
  pts.forEach((p) => {
    add('circle', { cx: p.x, cy: p.y, r: social ? 11 : 8, fill: css('--node') });
    const left = p.c < -0.2, right = p.c > 0.2;
    add('text', {
      x: p.x + (right ? 16 : left ? -16 : 0),
      y: p.y + (!left && !right ? (p.s < 0 ? -16 : 28) : 6),
      'text-anchor': right ? 'start' : left ? 'end' : 'middle',
      'font-size': social ? 24 : 18,
    }, p.name);
  });
</script>
</body>
</html>
